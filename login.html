<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klientská zóna — Odlož.to</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="portal.css">
  </head>
  <body class="portal-page">
    <header class="site-header portal-header">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="logo-new.svg" alt="Odlož.to"></span><span class="brand-name">odlož.to</span></a>
      <a class="text-link" href="index.html">← Zpět na web</a>
    </header>
    <main class="auth-layout">
      <section class="auth-intro">
        <p class="eyebrow">Bezpečné skladování</p>
        <h1>Váš prostor<br><em>pod kontrolou.</em></h1>
        <p>Sledujte uložené boxy, termíny vyzvednutí a faktury. Jednoduše a bezpečně z jednoho místa.</p>
        <div class="auth-points"><span>✓ Přehled uložených věcí</span><span>✓ Faktury kdykoliv po ruce</span><span>✓ Jednoduchá správa boxů</span></div>
      </section>
      <section class="auth-card">
        <div class="auth-tabs"><button class="auth-tab is-active" data-auth-tab="login" type="button">Přihlášení</button><button class="auth-tab" data-auth-tab="register" type="button">Registrace</button></div>
        <form id="login-form" class="auth-form">
          <label for="email">E-mail</label><input id="email" type="email" value="demo@odloz.to" required>
          <label for="password">Heslo</label><input id="password" type="password" value="demo123" required>
          <button class="button button-full" type="submit">Přihlásit se →</button>
          <p class="demo-hint">Demo účet: demo@odloz.to / demo123</p>
          <p class="auth-error" id="auth-error" role="alert"></p>
        </form>
        <form id="register-form" class="auth-form is-hidden">
          <label for="register-name">Jméno</label><input id="register-name" type="text" required>
          <label for="register-email">E-mail</label><input id="register-email" type="email" required>
          <label for="register-password">Heslo</label><input id="register-password" type="password" minlength="6" required>
          <button class="button button-full" type="submit">Vytvořit účet →</button>
          <p class="auth-error" id="register-error" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="portal.js"></script>
  </body>
</html>
